name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual deploy of any branch, so docs changes can be previewed live
  # before merging (Settings → Pages serves them at the site URL).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  # Build the Starlight site (link validation fails the build on broken
  # internal links) and fail if the generated reference pages drift from
  # the Go sources (same pattern as the golden tests for generated/).
  docs:
    name: Docs build and drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        working-directory: docs
        run: npm ci

      - name: Build docs (includes link validation)
        working-directory: docs
        run: npm run build

      - name: Regenerate reference pages
        run: go run ./tools/docgen

      - name: Fail on docs drift
        run: git diff --exit-code docs/src/content/docs/reference/generated

  # The quickstart script needs network access (Go module downloads and the
  # npx-fetched MCP conformance suite), so it runs as its own job and is not
  # part of the required Go quality gates.
  quickstart:
    name: Verify README quickstart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run the quickstart commands
        run: scripts/verify-quickstart.sh

  # Deploy the built site to GitHub Pages on push to main.
  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [docs]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        working-directory: docs
        run: npm ci

      - name: Build docs
        working-directory: docs
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
