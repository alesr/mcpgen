name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ultimate-ci runs lint, modernize, govulncheck, tidy, and race-enabled
      # tests with coverage in parallel.
      - name: Ultimate Go CI
        id: ci
        uses: alesr/ultimate-ci@v1
        with:
          go-version-file: go.mod

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: alesr/mcpgen
          files: ${{ steps.ci.outputs.test-coverage-file }}

  # golangci-lint defaults do not include gofmt and the repo has no golangci
  # config, so keep an explicit formatting gate.
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          output=$(gofmt -l .)
          if [ -n "$output" ]; then
            echo "The following files are not formatted:"
            echo "$output"
            exit 1
          fi

  goreleaser:
    name: Goreleaser dry-run
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Goreleaser dry-run
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --snapshot --clean

  # Generate-and-verify matrix: every permutation is generated into a temp
  # dir and pushed through the full check pipeline (build, vet, test, and the
  # MCP conformance suite for http). Catches SDK/spec drift immediately.
  generate-and-verify:
    name: Generate and verify
    needs: [quality, fmt]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stdio-default
            args: --transport stdio
          - name: http-full
            args: --transport http --port 9090
          - name: http-latest-only
            args: --transport http --protocol latest-only --features tasks,skills,oauth
          - name: stdio-empty
            args: --transport stdio --no-stubs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build mcpgen
        run: go build -o /tmp/mcpgen .

      - name: Generate project
        run: /tmp/mcpgen new /tmp/gen/${{ matrix.name }} --name ${{ matrix.name }} --module example.com/${{ matrix.name }} ${{ matrix.args }} --no-check --json

      - name: Check project (build, vet, test, conformance)
        run: /tmp/mcpgen check /tmp/gen/${{ matrix.name }} --json
